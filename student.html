<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - Live Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .video-wrapper {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: 1rem; overflow: hidden; margin-bottom: 1rem;
        }
        .video-wrapper iframe, .video-wrapper #player {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        .no-stream-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; text-align: center;
        }
        .chat-box {
            height: 400px; overflow-y: auto; background: #fff; border-radius: 0.5rem; padding: 0.8rem;
        }
        .chat-msg { margin-bottom: 0.5rem; word-break: break-word; }
        .chat-msg strong { color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container py-3">
        <h2 class="mb-3">📺 Live Class (Student)</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="video-wrapper" id="videoContainer">
                    <div id="player"></div>
                    <div id="noStreamMsg" class="no-stream-msg">
                        <h4>⏳ स्ट्रीम का इंतज़ार है...</h4>
                        <p>Admin जल्द ही वीडियो सेट करेगा।</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">💬 Live Chat</div>
                    <div class="chat-box" id="chatMessages"></div>
                    <div class="card-footer">
                        <div class="input-group">
                            <input type="text" class="form-control" id="nameInput" placeholder="आपका नाम" maxlength="20">
                            <input type="text" class="form-control" id="messageInput" placeholder="मैसेज लिखें...">
                            <button class="btn btn-primary" id="sendBtn">भेजें</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (सिर्फ app और realtime-database) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeZl52HEWGz-vE72QZ5taznvpYTfq3QUk",
            authDomain: "login-and-reg-5728d.firebaseapp.com",
            databaseURL: "https://login-and-reg-5728d-default-rtdb.firebaseio.com",
            projectId: "login-and-reg-5728d",
            storageBucket: "login-and-reg-5728d.firebasestorage.app",
            messagingSenderId: "435846403197",
            appId: "1:435846403197:web:d6a05a55e40839d15dcd14"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let player = null;
        let ytReady = false;
        let currentVideoId = null;   // admin से आने वाली ID
        let loadedVideoId = null;    // प्लेयर में लोडेड ID (ताकि बेवजह reload न करें)

        window.onYouTubeIframeAPIReady = function () {
            ytReady = true;
            // अगर कोई वीडियो ID सेट है और अभी तक लोड नहीं हुई, तो अब लोड करें
            if (currentVideoId && currentVideoId !== loadedVideoId) {
                createOrLoadPlayer(currentVideoId);
            }
        };

        function createOrLoadPlayer(videoId) {
            if (!ytReady || !videoId) return;
            // अगर प्लेयर मौजूद है और वीडियो ID वही है तो कुछ मत करो
            if (player && loadedVideoId === videoId) return;

            if (player) {
                // पुराना प्लेयर हटाओ
                player.destroy();
                player = null;
            }

            document.getElementById('noStreamMsg').style.display = 'none';
            player = new YT.Player('player', {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0 },
                events: {
                    'onReady': () => {
                        // प्लेयर तैयार है, कुछ खास नहीं करना
                    },
                    'onError': (e) => console.error('YouTube player error:', e)
                }
            });
            loadedVideoId = videoId; // रिकॉर्ड रखो
        }

        // रियलटाइम डेटाबेस से स्ट्रीम सुनें
        rtdb.ref('stream').on('value', (snap) => {
            const data = snap.val();
            const msgDiv = document.getElementById('noStreamMsg');

            if (data && data.youtubeId) {
                const id = data.youtubeId;
                if (id && id.length === 11) {
                    currentVideoId = id;
                    if (ytReady) {
                        // अगर पहले से सेम नहीं है तो लोड करें
                        createOrLoadPlayer(id);
                    }
                    // प्लेयर बनने के बाद मैसेज छुपा देंगे
                } else {
                    // गलत ID
                    msgDiv.style.display = 'block';
                    msgDiv.innerHTML = '<h4>❌ गलत स्ट्रीम ID</h4>';
                    if (player) { player.destroy(); player = null; loadedVideoId = null; }
                }
            } else {
                // कोई स्ट्रीम सेट नहीं
                msgDiv.style.display = 'block';
                msgDiv.innerHTML = '<h4>⏳ स्ट्रीम का इंतज़ार है...</h4><p>Admin जल्द ही वीडियो सेट करेगा।</p>';
                if (player) { player.destroy(); player = null; loadedVideoId = null; }
            }
        });

        // ---------- Chat (Realtime Database) ----------
        const chatRef = rtdb.ref('chat/messages');
        const messagesDiv = document.getElementById('chatMessages');

        chatRef.limitToLast(50).on('child_added', (snap) => {
            const msg = snap.val();
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<strong>${msg.username || 'Anonymous'}</strong> <small class="text-muted">${time}</small><br>${msg.message}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim() || 'Guest';
            const msg = document.getElementById('messageInput').value.trim();
            if (!msg) return;
            chatRef.push({
                username: name,
                message: msg,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById('messageInput').value = '';
        });

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });

        // YouTube API script डायनैमिकली लोड करें
        (function loadYT() {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            const firstScript = document.getElementsByTagName('script')[0];
            firstScript.parentNode.insertBefore(tag, firstScript);
        })();
    </script>
</body>
</html>
