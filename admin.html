<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Set Stream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow p-4">
            <h2 class="text-warning mb-3">⚙️ Admin Stream Control</h2>
            <p class="text-muted">YouTube link डालें और "Update" दबाएं। Student page तुरंत वीडियो दिखाएगा।</p>
            <input type="text" id="youtubeInput" class="form-control mb-3" placeholder="e.g. dQw4w9WgXcQ या full URL">
            <button id="setVideoBtn" class="btn btn-primary w-100">📡 Update Stream</button>
            <div id="status" class="mt-3"></div>
        </div>
    </div>

    <!-- Firebase SDKs (सिर्फ app और realtime-database) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeZl52HEWGz-vE72QZ5taznvpYTfq3QUk",
            authDomain: "login-and-reg-5728d.firebaseapp.com",
            databaseURL: "https://login-and-reg-5728d-default-rtdb.firebaseio.com",
            projectId: "login-and-reg-5728d",
            storageBucket: "login-and-reg-5728d.firebasestorage.app",
            messagingSenderId: "435846403197",
            appId: "1:435846403197:web:d6a05a55e40839d15dcd14"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        function extractId(url) {
            const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(reg);
            return match ? match[1] : url.trim();
        }

        document.getElementById('setVideoBtn').addEventListener('click', async () => {
            const input = document.getElementById('youtubeInput').value.trim();
            const videoId = extractId(input);
            if (!videoId || videoId.length !== 11) {
                document.getElementById('status').innerHTML = '<span class="text-danger">❌ गलत YouTube लिंक या ID</span>';
                return;
            }
            try {
                await rtdb.ref('stream').set({ 
                    youtubeId: videoId, 
                    updatedAt: Date.now() 
                });
                document.getElementById('status').innerHTML = 
                    `<span class="text-success">✅ स्ट्रीम सेट हो गई! Video ID: ${videoId}</span>`;
            } catch (err) {
                document.getElementById('status').innerHTML = 
                    `<span class="text-danger">Error: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
