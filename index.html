<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EduStream - No Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height:100vh;">
    <div class="text-center">
        <h1 class="mb-4">📚 Live Class (No Login)</h1>
        <a href="student.html" class="btn btn-primary btn-lg m-2">👨‍🎓 Student View</a>
        <button id="adminBtn" class="btn btn-warning btn-lg m-2">⚙️ Admin Panel</button>
    </div>

    <!-- Password Modal -->
    <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content bg-secondary text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title">🔐 Admin Access</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Enter admin password to continue</p>
                    <input type="password" id="passwordInput" class="form-control bg-dark text-white border-0" placeholder="Enter password..." autofocus>
                    <div id="errorMsg" class="text-danger mt-2" style="display:none;">❌ Incorrect password!</div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="submitPassword" class="btn btn-warning">Unlock 🔓</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const adminBtn = document.getElementById('adminBtn');
        const passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitPassword');
        const errorMsg = document.getElementById('errorMsg');
        const CORRECT_PASSWORD = 'Sumit@2004';

        adminBtn.addEventListener('click', () => {
            passwordModal.show();
            setTimeout(() => passwordInput.focus(), 300);
            errorMsg.style.display = 'none';
            passwordInput.value = '';
        });

        function checkPassword() {
            if (passwordInput.value === CORRECT_PASSWORD) {
                passwordModal.hide();
                window.location.href = 'admin.html';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
                passwordInput.classList.add('is-invalid');
                setTimeout(() => passwordInput.classList.remove('is-invalid'), 500);
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
